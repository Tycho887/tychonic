[package]
name = "tychonic-tools"
version = "0.9.2"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[dependencies]
tychonic = { path = ".." }
serde_json = "1"
tychonic-constrained = { path = "../constrained", optional = true }
ipopt = { version = "=0.6.0", optional = true }

[features]
profile-allocations = []
native-reference = ["dep:ipopt", "dep:tychonic-constrained"]

[profile.release]
debug = 1
