name: Rust contracts
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_checks:
        description: Run the long regression and package verification
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SATKIT_DATA: /tmp/satkit-data
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust release tag and crate versions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          core = tomllib.loads(Path('Cargo.toml').read_text())
          companion = tomllib.loads(Path('constrained/Cargo.toml').read_text())
          version = core['package']['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('release tag must match the core crate version')
          if companion['package']['version'] != version:
              raise SystemExit('core and constrained crate versions must match')
          if companion['dependencies']['tychonic']['version'] != f'={version}':
              raise SystemExit('constrained must depend on the matching core version')
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            tools -> target
      - uses: actions/cache@v4
        with:
          path: ${{ env.SATKIT_DATA }}
          key: satkit-data-0.24.1
      - run: python3 scripts/check_core_policy.py
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path tools/Cargo.toml --all -- --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - run: cargo check --manifest-path tools/Cargo.toml --locked --all-targets --features profile-allocations
      - run: cargo run --locked --manifest-path tools/Cargo.toml --bin provision_data
      - run: cargo test --locked
        env:
          SATKIT_OFFLINE: '1'
      - run: cargo test --locked --release -p tychonic-constrained
        env:
          SATKIT_OFFLINE: '1'
      - run: cargo doc --workspace --locked --no-deps --lib
      - if: inputs.release_checks || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: cargo test --locked --release --test bootstrap bootstrap_24_hour_fit_recovers_state_and_drag_from_weak_pointing -- --ignored --exact
        env:
          SATKIT_OFFLINE: '1'
      - if: inputs.release_checks || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
        run: |
          sudo apt-get update
          sudo apt-get install -y coinor-libipopt-dev libclang-dev cmake
          cargo test --locked --release --manifest-path tools/Cargo.toml --features native-reference --test native_reference -- --test-threads=1
          cargo test --locked --release -p tychonic-constrained --test fit -- --ignored --nocapture --test-threads=1
          cargo package --workspace --locked
        env:
          SATKIT_OFFLINE: '1'
          IPOPT_NO_PKG_CONFIG: '1'

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    environment: cratesio
    concurrency:
      group: cratesio-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Authenticate with crates.io Trusted Publishing
        if: env.CARGO_REGISTRY_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish core, then constrained crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p tychonic
          cargo publish --locked -p tychonic-constrained
