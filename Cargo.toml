[package]
name = "tychonic"
version = "0.9.7"
edition = "2024"
description = "Passive orbit determination with Doppler, interferometric phase, differential Doppler, and angles."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tycho887/tychonic"
documentation = "https://docs.rs/tychonic"
readme = "README.md"
keywords = ["orbit-determination", "astrodynamics", "ekf", "doppler", "interferometry"]
categories = ["aerospace", "science"]
include = [
    "/Cargo.toml", "/Cargo.lock", "/clippy.toml", "/README.md", "/CHANGELOG.md",
    "/LICENSE-MIT", "/LICENSE-APACHE", "/references/README.md",
    "/src/**", "/tests/**", "/benches/**", "/examples/**", "/docs/**",
]

[lib]
name = "tychonic"
path = "src/lib.rs"

[dependencies]
numeris = { version = "=0.6.0", features = ["optim", "estimate"] }
satkit = "=0.24.1"

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "kernels"
harness = false

[profile.release]
debug = 1

[profile.bench]
debug = 1
